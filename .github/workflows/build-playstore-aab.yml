name: Build Play Store AAB (Release)

on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: "Optional Supabase Project URL (overrides SUPABASE_URL repo secret)"
        required: false
        type: string
      supabase_anon_key:
        description: "Optional Supabase Publishable/Anon Key (overrides SUPABASE_ANON_KEY repo secret)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-playstore-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Play Store signing secrets
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required GitHub Secrets: UPLOAD_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD. Add them in Repo Settings -> Secrets and variables -> Actions before running this Play Store release build."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Play Store upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          RAW_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          CLEAN_B64="$(printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '\n\r\t ')"
          CLEAN_STORE_PASS="$(printf '%s' "$RAW_STORE_PASSWORD" | tr -d '\r\n')"
          CLEAN_KEY_PASS="$(printf '%s' "$RAW_KEY_PASSWORD" | tr -d '\r\n')"
          if ! printf '%s' "$CLEAN_B64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks" 2>/dev/null; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is not valid Base64 text. Do not paste a password here — paste the entire contents of your keystore text file."
            exit 1
          fi
          chmod 600 "${GITHUB_WORKSPACE}/my-upload-key.jks"
          BYTES="$(wc -c < "${GITHUB_WORKSPACE}/my-upload-key.jks")"
          echo "Decoded keystore file size: ${BYTES} bytes"
          KEYTOOL_OUT="$(keytool -list -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" -storepass "$CLEAN_STORE_PASS" -alias upload 2>&1)" || {
            SAFE_ERR="$(printf '%s' "$KEYTOOL_OUT" | tr '\n' ' ' | cut -c1-240)"
            echo "::error::Keystore open failed (${BYTES} bytes): ${SAFE_ERR}"
            exit 1
          }
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi
          echo "Verified Play Store upload keystore and alias 'upload'."

      - name: Configure Supabase environment (.env)
        env:
          INPUT_SUPABASE_URL: ${{ inputs.supabase_url }}
          INPUT_SUPABASE_ANON_KEY: ${{ inputs.supabase_anon_key }}
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SUPA_URL="${INPUT_SUPABASE_URL:-$SECRET_SUPABASE_URL}"
          SUPA_KEY="${INPUT_SUPABASE_ANON_KEY:-$SECRET_SUPABASE_ANON_KEY}"
          if [ -z "$SUPA_URL" ] || [ -z "$SUPA_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY secrets. Add them in GitHub Secrets so your Play Store AAB connects to your live Supabase backend."
            exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPA_URL" "$SUPA_KEY" > .env
          chmod 600 .env

      - name: Build signed Play Store Android App Bundle (.aab)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          RAW_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export STORE_PASSWORD="$(printf '%s' "$RAW_STORE_PASSWORD" | tr -d '\r\n')"
          export KEY_PASSWORD="$(printf '%s' "$RAW_KEY_PASSWORD" | tr -d '\r\n')"
          gradle :app:bundleRelease --no-daemon

      - name: Prepare downloadable Play Store AAB
        run: cp app/build/outputs/bundle/release/app-release.aab Mila-Hospitality-PlayStore.aab

      - name: Clean up sensitive keystore and .env
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks" .env

      - name: Upload Play Store AAB ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mila-Hospitality-PlayStore-AAB
          path: Mila-Hospitality-PlayStore.aab
          retention-days: 30
