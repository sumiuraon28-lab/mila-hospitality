<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141816" />
  <meta http-equiv="refresh" content="0; url=./ios-app/" />
  <title>MILA Hospitality Consultant</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./ios-app/apple-touch-icon.png" />
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #141816;
      color: #f5f2eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: #1b201d;
      border: 1px solid rgba(212, 175, 122, 0.3);
      border-radius: 20px;
      padding: 28px 22px;
    }
    img {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      border: 1px solid #d4af7a;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-size: 22px;
      color: #f5f2eb;
    }
    p {
      margin: 0 0 20px;
      font-size: 14px;
      color: #c8c1b4;
    }
    a.btn {
      display: block;
      padding: 13px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 10px;
    }
    a.gold {
      background: #d4af7a;
      color: #141816;
    }
    a.outline {
      border: 1px solid rgba(212, 175, 122, 0.45);
      color: #d4af7a;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./ios-app/apple-touch-icon.png" alt="MILA Hospitality" />
    <h1>MILA Hospitality Consultant</h1>
    <p>Opening the MILA iPhone &amp; Web App...</p>
    <a class="btn gold" href="./ios-app/">Open MILA App (iPhone / Web)</a>
    <a class="btn outline" href="./admin-portal/">Open Admin Panel</a>
  </div>
</body>
</html>
